<style>
/* 版面：單欄工作台。鑄鐵色頂列（店名＋搜尋）壓住鋼板灰工作面；清單共用一條格線；底部常駐詢價條。強調色只有黃銅。
   灰字（--muted／--head-muted／--tile-muted／--field-ph）對各自底色一律 ≥ 7:1。 */
:root{
  --bg:#E4E8EA;          /* 鋼板灰 */
  --surface:#F5F7F8;
  --ink:#14181B;         /* 機油黑 */
  --muted:#3B444C;
  --line:#C3CBD1;
  --rule:#14181B;
  --head:#1A2B4A;         /* 3100 導覽列深藍（brand-800）；業主 2026-10-26：整站改這套配色 */        /* 鑄鐵 */
  --head-ink:#EDF0F2;
  --head-muted:#B9C3D6;
  --tile:#1E2D4F;         /* 深藍（brand-700） */
  --tile-ink:#F1F3F4;
  --tile-muted:#BAC3CA;
  --tile-line:#3A4A6E;
  --brass:#E8B84B;        /* 3100 金黃（gold-400；H 字那個黃） */       /* 黃銅 */
  --brass-ink:#7A5A10;
  --on-brass:#16130C;
  --btn2:#2B3338;
  --btn2-ink:#F1F3F4;
  --field:#FFFFFF;
  --field-ink:#14181B;
  --field-ph:#4A545C;
  --field-line:#6E7880;  /* 輸入框邊（對背景 ≥3:1） */
  --search-line:#FFFFFF;
  --plate:#243454;
  --row-hover:#D9DFE3;
  --scrim:rgba(8,10,12,.94);
  --lb-ink:#F1F3F4;
  --font-body:"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-code:"Barlow Semi Condensed","Noto Sans TC","Arial Narrow","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101316; --surface:#181D21; --ink:#E6EAEC; --muted:#B4BEC5; --line:#2B3339; --rule:#56616A;
    --head:#0A0D0F; --head-ink:#E6EAEC; --head-muted:#A9B4BC;
    --tile:#1E252A; --tile-ink:#EEF1F2; --tile-muted:#B4BEC5; --tile-line:#343D43;
    --brass:#D6A646; --brass-ink:#E4BA62; --on-brass:#15110A;
    --btn2:#2A3237; --btn2-ink:#EEF1F2;
    --field:#1C2226; --field-ink:#EEF1F2; --field-ph:#ABB5BC; --field-line:#7F8B93; --search-line:#7F8B93;
    --plate:#0B0E10; --row-hover:#1F262B; --scrim:rgba(0,0,0,.95); --lb-ink:#EEF1F2;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101316; --surface:#181D21; --ink:#E6EAEC; --muted:#B4BEC5; --line:#2B3339; --rule:#56616A;
  --head:#0A0D0F; --head-ink:#E6EAEC; --head-muted:#A9B4BC;
  --tile:#1E252A; --tile-ink:#EEF1F2; --tile-muted:#B4BEC5; --tile-line:#343D43;
  --brass:#D6A646; --brass-ink:#E4BA62; --on-brass:#15110A;
  --btn2:#2A3237; --btn2-ink:#EEF1F2;
  --field:#1C2226; --field-ink:#EEF1F2; --field-ph:#ABB5BC; --field-line:#7F8B93; --search-line:#7F8B93;
  --plate:#0B0E10; --row-hover:#1F262B; --scrim:rgba(0,0,0,.95); --lb-ink:#EEF1F2;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:19px;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-y:contain}  /* 手機下拉換一批自己做，不讓瀏覽器的下拉重新整理搶走 */
html.lock{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--head)}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a,button,.btn,.entry,.nrow,.prow,label,summary{user-select:none;-webkit-user-select:none}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
img{max-width:100%}
h1,h2{text-wrap:balance}
[hidden]{display:none!important}

.gut{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.inner{max-width:900px;margin-inline:auto}

/* ── 頂列 ── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--head);color:var(--head-ink)}
.top .inner{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:.35rem 1.2rem;padding-block:.45rem .6rem}
.shop{display:inline-flex;align-items:center;gap:.55rem;min-height:48px;max-width:100%;text-decoration:none;font-weight:700;font-size:1.12rem;letter-spacing:.06em;white-space:nowrap;justify-self:start}
.shop small{font-size:1rem;font-weight:500;color:var(--head-muted);letter-spacing:.04em}
#shopName{min-width:0;overflow:hidden;text-overflow:ellipsis}
.hdrow{display:flex;align-items:center;gap:.6rem;min-width:0}
.hdrow .shop{min-width:0}
.hdrow .homebtn{margin-left:auto}
.hdrow .homebtn[hidden]+.langbtn{margin-left:auto}
@media (max-width:479px){html[lang=en] .shop small{display:none}}
/* 右上語言切換（業主 2026-10-26 第 11 點）：顯示「另一個語言」的名字 */
.langbtn{flex:none;min-height:2.4rem;padding:0 .7rem;border:1.5px solid var(--head-muted);border-radius:999px;background:transparent;color:var(--head-ink);font-weight:700;font-size:.9rem;cursor:pointer}
.hlogo-wrap{flex:none;display:inline-flex}
.hlogo-wrap svg{display:block;width:1.65rem;height:1.65rem;border-radius:4px}
/* 內頁表頭常駐「⌂ 首頁」（業主 2026-10-26 第 7 點：點進去的內頁上方要有回首頁） */
.homebtn{display:inline-flex;align-items:center;min-height:2.4rem;padding:0 .75rem;border-radius:999px;background:var(--brass);color:var(--on-brass);font-weight:700;font-size:.95rem;text-decoration:none;white-space:nowrap}
.search{position:relative;margin:0}
.search svg{position:absolute;left:.75rem;top:50%;width:1.15rem;height:1.15rem;transform:translateY(-50%);color:var(--field-ph);pointer-events:none}
.search input{display:block;width:100%;height:52px;border:2px solid var(--search-line);border-radius:6px;background:var(--field);color:var(--field-ink);padding:0 4.4rem 0 2.4rem;font-size:1.05rem;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--field-ph)}
.search input:placeholder-shown{padding-right:.8rem}  /* 空白時清除鈕不在，讓「料號」整段看得到 */
.search input:focus{outline:none;border-color:var(--brass)}
.search input::-webkit-search-cancel-button{display:none}
.kwclear{position:absolute;right:2px;top:2px;bottom:2px;min-width:4rem;border:0;border-radius:0 4px 4px 0;background:transparent;color:var(--brass-ink);font-weight:700;font-size:.95rem}
@media (max-width:719px){.top .inner{grid-template-columns:minmax(0,1fr);gap:.15rem}}

/* ── 頁首下一行：怎麼買三步（同一行，手機可折兩行，字 ≥16px） ── */
.banner{background:var(--surface);border-bottom:1px solid var(--line);color:var(--ink);font-size:max(16px,.9rem)}
.steps{display:flex;flex-wrap:wrap;align-items:baseline;gap:.05rem 1rem;margin:0;padding:.4rem 0;list-style:none;font-weight:500;line-height:1.45}
.steps li{min-width:0}
.steps .no{color:var(--brass-ink);font-weight:700;margin-right:.2em}

.main{padding-block:1rem calc(5.4rem + env(safe-area-inset-bottom,0px))}

/* ── 首頁 ── */
/* 兩顆入口永遠並排在最上面（業主 2026-10-26）；手機每顆約 170px 寬，字縮一號 */
.entries{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"k go" "n n";gap:.1rem .5rem;align-items:center;min-height:5.6rem;padding:.7rem .55rem .65rem;background:var(--tile);color:var(--tile-ink);border-radius:8px;text-decoration:none;min-width:0}
.entry:active{filter:brightness(1.12)}
.e-k{grid-area:k;font-size:1rem;line-height:1.25;font-weight:700;letter-spacing:.01em;min-width:0}
.e-k span{display:inline-block}  /* 只在「照廠牌・｜車種找」這種設計好的位置折行，不會折成「照廠牌・車｜種找」 */
.e-n{grid-area:n;color:var(--tile-muted);font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e-n b{color:var(--brass);font-family:var(--font-code);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums;margin-right:.15em}
.e-n i{display:inline-block;width:.7em}
.e-x{display:none}  /* 手機三顆並排放不下「6 車種」，只留廠牌數；寬一點才一起顯示 */
.e-go{grid-area:go;display:none;font-size:1.8rem;line-height:1;color:var(--brass)}
@media (min-width:560px){.e-x{display:inline}.entries{gap:.8rem}.entry{min-height:6.2rem;padding:1rem 1.1rem .95rem}.e-k{font-size:1.35rem}.e-n{font-size:.95rem}.e-n b{font-size:1.35rem}.e-go{display:block;font-size:2.2rem}}
/* ── 首頁圖片牆：有照片的商品隨機排、每次打開都不同（淘寶式；業主 2026-10-26）。手機 2 欄、平板 3、桌機 4 ── */
.wall-h{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"t a" "n a";align-items:center;gap:0 .8rem;margin:1.1rem 0 .55rem;padding-top:.8rem;border-top:2px solid var(--rule)}
.wall-h h2{grid-area:t;margin:0;font-size:1.2rem}
.wall-h .n{grid-area:n;color:var(--muted);font-size:.86rem}
.wall-h .n b{color:var(--ink);font-family:var(--font-code);font-weight:600}
.wall-act{grid-area:a;display:flex;gap:.5rem}
.wall{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
@media (min-width:560px){.wall{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:820px){.wall{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:1100px){.wall{grid-template-columns:repeat(5,minmax(0,1fr))}}  /* 業主 2026-10-26 2A：電腦 5 欄一批 30 */
.tile{position:relative;display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;text-decoration:none}
.tlink{display:flex;flex-direction:column;min-width:0;text-decoration:none;color:inherit}
/* 卡片角落：幾張照片（左下）、只剩 N（右下，亞馬遜「Only 2 left」） */
.tile .t-np,.tile .t-left{position:absolute;bottom:.35rem;padding:.05rem .4rem;border-radius:4px;font-size:.72rem;font-weight:700;line-height:1.4;pointer-events:none}
.tile .t-np{left:.35rem;background:var(--scrim);color:var(--lb-ink)}
.tile .t-left{right:.35rem;background:#b3261e;color:#fff}
/* 五大標籤：品名／車種／規格・品牌・年份，再一列 現有數量＋「＋詢價」（蝦皮卡片的加入購物車） */
.tile .t-m{display:flex;flex-wrap:wrap;gap:0 .5rem;padding:0 .55rem;min-height:1.5rem;max-height:3rem;overflow:hidden;color:var(--muted);font-size:.82rem;line-height:1.45}
.tile .t-f{display:flex;align-items:center;justify-content:space-between;gap:.4rem;padding:.35rem .55rem .5rem;margin-top:auto}
.tile .t-q{font-size:.86rem;min-width:0;line-height:1.35}
.tile .t-ql{display:none}  /* 手機卡片窄，「現有」兩個字省掉，只印數字＋單位；寬一點才印 */
@media (min-width:560px){.tile .t-ql{display:inline}}
.tile .t-q .qa,.tile .t-q .qb{font-family:var(--font-code);font-weight:600;white-space:nowrap}  /* 數字跟單位不拆開；兩種單位之間才換行 */
.tile .t-q .u{color:var(--muted);margin-left:.1em}
.t-add{flex:none;min-height:2.4rem;padding:0 .7rem;border:2px solid var(--brass);border-radius:6px;background:var(--brass);color:var(--on-brass);font-weight:700;font-size:.88rem;line-height:1;white-space:nowrap;cursor:pointer}
.t-add.on{background:transparent;color:var(--brass-ink)}
.tile .c-ph img{border-radius:0}
.tile .c-ph .ck{top:.35rem;right:.35rem}
.tile .t-n{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;overflow-wrap:anywhere;padding:.45rem .55rem 0;font-weight:700;line-height:1.3;min-height:calc(2.6em + .45rem)}
.tile .t-c{padding:.1rem .55rem .15rem;font-family:var(--font-code);font-weight:600;font-size:1rem;color:var(--ink);min-height:1.5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile:active{filter:brightness(.97)}
@media (hover:hover){.tile:hover{border-color:var(--brass)}}
/* 類別快捷列（淘寶最上面那排）：一排可左右滑 */
.wall-bar{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .9rem;margin:1rem 0 .7rem;padding-top:.8rem;border-top:2px solid var(--rule)}
.wall-bar .chips{margin:0}
.chiplab{color:var(--muted);font-size:.9rem;white-space:nowrap}
.chiplab.n{margin-left:.2rem}
.chips{display:flex;gap:.45rem;overflow-x:auto;scrollbar-width:none;margin:0 0 .7rem;padding-bottom:.1rem}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:.3rem;min-height:2.5rem;padding:0 .85rem;border:2px solid var(--field-line);border-radius:999px;background:transparent;color:var(--ink);font-weight:700;font-size:.92rem;white-space:nowrap;cursor:pointer}
.chip b{font-family:var(--font-code);font-weight:600;font-size:.9em;color:var(--muted)}
.chip.on{background:var(--head);border-color:var(--head);color:var(--head-ink)}
.chip.on b{color:var(--brass)}
/* 牆底：還有就「再看 N 個」（自動接的備援）；看完了就說看完了＋換一批 */
.wall-end{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.6rem;min-height:3.4rem;margin-top:.9rem}
.wall-done{margin:0;color:var(--muted)}
/* 你剛看過（亞馬遜 recently viewed）：一排小卡左右滑，只存在客人自己的瀏覽器 */
.recent{margin:1.1rem 0 .2rem;padding-top:.8rem;border-top:2px solid var(--rule)}
.recent h2{margin:0 0 .5rem;font-size:1.05rem}
.rstrip{display:flex;gap:.5rem;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:.3rem;scrollbar-width:thin}
.rtile{flex:0 0 6.4rem;scroll-snap-align:start;display:flex;flex-direction:column;min-width:0;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rtile img,.rtile .noimg{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;background:var(--plate)}
.rtile .noimg{display:grid;place-items:center;color:var(--tile-muted)}
.rtile .noimg svg{width:60%;height:60%}
.rtile .rn{padding:.3rem .4rem 0;font-size:.82rem;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtile .rc{padding:0 .4rem .35rem;font-family:var(--font-code);font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 回到最上面（右下角，詢價列上方）；下拉換一批的提示（頂端小膠囊） */
.totop{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(4.6rem + env(safe-area-inset-bottom,0px));z-index:29;width:3rem;height:3rem;border-radius:50%;border:2px solid var(--brass);background:var(--head);color:var(--head-ink);font-size:1.4rem;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.4);opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .18s,transform .18s;cursor:pointer}
.totop.show{opacity:1;transform:none;pointer-events:auto}
html.lock .totop{display:none}
.ptr{position:fixed;left:50%;top:env(safe-area-inset-top,0px);z-index:31;transform:translate(-50%,-120%);padding:.35rem .9rem;border-radius:999px;background:var(--head);color:var(--head-ink);border:2px solid var(--brass);font-weight:700;font-size:.9rem;white-space:nowrap;transition:transform .15s;pointer-events:none}
.ptr.show{transform:translate(-50%,.6rem)}
.ptr.ready{background:var(--brass);color:var(--on-brass)}
/* 清單規格欄後面的年份（小字） */
.yr{color:var(--muted);font-size:.9em;margin-left:.25em}
/* 資料還沒到（全部商品分檔載入中） */
.loading{padding:1.2rem 0;border-top:2px solid var(--rule)}
.loading p{margin:0 0 .8rem;font-size:1.1rem;font-weight:700;color:var(--muted)}
.loading .row{display:flex;flex-wrap:wrap;gap:.6rem}
.allrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:1rem;min-height:3.6rem;margin-top:.8rem;padding:.5rem 1.1rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;text-decoration:none;font-weight:700;font-size:1.1rem}
.allrow .c{font-weight:500;color:var(--muted)}
.allrow .c b{color:var(--ink);font-family:var(--font-code);font-size:1.15em;font-variant-numeric:tabular-nums}
.allrow .go{color:var(--brass-ink);font-size:1.6rem;line-height:1}
/* 店家資訊（地址／營業時間／回覆說明：設定有填才出現） */
.store{margin:1.4rem 0 0;padding-top:.9rem;border-top:2px solid var(--rule)}
.store-top{margin:.8rem 0 0}
.store-top .store{margin:0;padding-top:.6rem}
.store-top .store p{margin:.1rem 0}
.store-top .contact{margin-top:.3rem}
.store p{margin:0 0 .25rem;font-size:1.02rem;overflow-wrap:anywhere}
.store .st-a{font-weight:700;font-size:1.1rem}
.store .sel{user-select:text;-webkit-user-select:text}
.contact{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:.15rem 1.2rem;margin:1.4rem 0 0;padding-top:.9rem;border-top:2px solid var(--rule);font-size:.95rem}
.store+.contact{margin-top:.8rem;padding-top:.6rem;border-top-width:1px;border-top-color:var(--line)}
.contact dt{display:flex;align-items:center;min-height:48px;align-self:start;color:var(--muted)}
.contact dd{display:flex;flex-wrap:wrap;align-items:center;align-self:start;gap:.3rem .9rem;min-height:48px;margin:0;font-family:var(--font-code);font-weight:600;font-size:1.15rem;letter-spacing:.03em}
.contact .sel{user-select:text;-webkit-user-select:text}
.contact dd .sel{overflow-wrap:anywhere}
.contact dd>span.sel{display:inline-flex;align-items:center;min-height:48px}
.contact a.tl{display:inline-flex;align-items:center;min-height:48px;color:var(--brass-ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.22em}
.contact .btn{font-family:var(--font-body);letter-spacing:0}
.upd{margin:1rem 0 0;color:var(--muted);font-size:.95rem}
.upd b{color:var(--ink);font-family:var(--font-code);font-weight:600}

/* ── 清單頁頭 ── */
.lhead{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:0 1rem;margin-bottom:.6rem}
.backrow{grid-column:1/-1;display:flex;margin-top:-.4rem}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:0 .4rem;font-size:1.25rem;font-weight:700;min-width:0}
.crumbs a{display:inline-flex;align-items:center;justify-content:center;min-width:48px;min-height:48px;text-decoration:none;color:var(--brass-ink)}
@media (hover:hover){.crumbs a:hover{text-decoration:underline;text-decoration-color:var(--brass);text-underline-offset:.2em}}
@media (max-width:719px){.crumbs .far{display:none}}
.crumbs .sep{color:var(--muted);font-weight:400}
.crumbs .here{min-height:48px;display:inline-flex;align-items:center;min-width:0;overflow-wrap:anywhere}
.code{font-family:var(--font-code);font-weight:600;letter-spacing:.02em}
.zh{font-family:var(--font-body);font-weight:500;letter-spacing:0;margin-left:.35em}
.lmeta{display:flex;align-items:center;justify-content:flex-end;min-height:48px;gap:.6rem;white-space:nowrap;color:var(--muted);align-self:end}
.lmeta b{color:var(--ink);font-family:var(--font-code);font-size:1.2em;font-variant-numeric:tabular-nums}

/* ── 按鈕 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:3.1rem;padding:.4rem 1.05rem;border-radius:6px;border:2px solid transparent;background:var(--surface);color:var(--ink);font-weight:700;font-size:1.02rem;line-height:1.25;text-decoration:none;text-align:center}
.btn.primary{background:var(--brass);color:var(--on-brass)}
.btn.primary.on{background:transparent;border-color:var(--brass);color:var(--brass-ink)}
.btn.dark{background:var(--btn2);color:var(--btn2-ink)}
.btn.line{background:transparent;border-color:var(--field-line);color:var(--ink)}
.btn.small{min-height:48px;padding:.3rem .9rem;font-size:.95rem}
.btn.back{min-height:48px;padding:.3rem .1rem;border:0;background:transparent;color:var(--brass-ink);font-size:1rem}
.btn[disabled]{opacity:.45;cursor:default}
.btn:active:not([disabled]){transform:translateY(1px)}
.btn .tel{font-family:var(--font-code);font-weight:600;font-size:1.08rem;letter-spacing:.04em;white-space:nowrap}
.btn.stack{flex-direction:column;gap:0}
.btn .addr{font-family:var(--font-code);font-weight:600;font-size:1.02rem;letter-spacing:.02em;overflow-wrap:anywhere}

/* ── 分類清單（廠牌／車種／品名） ── */
.nlist{display:grid;border-top:2px solid var(--rule)}
@media (min-width:720px){.nlist.two{grid-template-columns:1fr 1fr;column-gap:2rem}}
.nrow{display:grid;grid-template-columns:minmax(0,1fr) max-content;grid-template-areas:"k c" "p c";column-gap:1rem;align-items:center;min-height:3.9rem;padding:.55rem .3rem;border-bottom:1px solid var(--line);text-decoration:none}
.nrow:active{background:var(--row-hover)}
@media (hover:hover){.nrow:hover{background:var(--row-hover)}}
.nrow .k{grid-area:k;font-size:1.2rem;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow .k.code{font-size:1.35rem}
.nrow .p{grid-area:p;color:var(--muted);font-size:.86rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow .c{grid-area:c;text-align:right;color:var(--muted);font-size:.95rem;white-space:nowrap}
.nrow .c b{color:var(--ink);font-family:var(--font-code);font-weight:600;font-size:1.3rem;font-variant-numeric:tabular-nums;margin-right:.15em}

/* ── 商品清單：表頭與每列共用同一條格線（subgrid），欄位起點跨列固定。
   窄（清單容器 < 34 字寬：手機，或字放大／頁面縮放）：照片｜品名（最多兩行）＋下一行車種、規格｜數量＋下一行品牌。
   寬（≥ 34 字寬）：照片｜品名｜車種｜規格｜品牌｜數量 一列一行（.c-main／.c-side 變成 display:contents）。
   依車種分段（grouped）與單一車種（bycar）不印車種欄（.nocar）；整張表都沒有規格就不畫規格欄（.nospec）。
   門檻用 em：字放大時也會換成窄版，數量欄永遠留在畫面內。 */
#view{container:view / inline-size}
.plist{--phw:96px;display:grid;grid-template-columns:var(--phw) minmax(0,1fr) fit-content(5.4em);column-gap:.7rem;border-top:2px solid var(--rule)}
@supports (width:1cqi){.plist{--phw:min(96px,24cqi)}}
.plist{--wc:var(--phw) minmax(6em,1fr) max-content fit-content(7em) fit-content(5em) max-content}
.plist.nospec{--wc:var(--phw) minmax(6em,1fr) max-content fit-content(5em) max-content}
.plist.nocar{--wc:var(--phw) minmax(6em,1fr) fit-content(7em) fit-content(5em) max-content}
.plist.nocar.nospec{--wc:var(--phw) minmax(6em,1fr) fit-content(5em) max-content}
.prow{grid-column:1/-1;display:grid;grid-template-columns:subgrid;align-items:center;min-height:3.1rem;padding-block:.35rem;border-bottom:1px solid var(--line);text-decoration:none}
a.prow:active{background:var(--row-hover)}
@media (hover:hover){a.prow:hover{background:var(--row-hover)}}
.phead{min-height:2.3rem;padding-block:.2rem;color:var(--muted);font-size:.86rem;font-weight:500}
.pseg{grid-column:1/-1;display:flex;align-items:flex-end;min-height:3rem;padding:.8rem .2rem .25rem;border-bottom:2px solid var(--rule)}
.pseg>span{display:flex;align-items:baseline;gap:.7rem;min-width:0}
.pseg .k{font-family:var(--font-code);font-weight:600;font-size:1.3rem;letter-spacing:.02em;overflow-wrap:anywhere}
.pseg .n{flex:none;color:var(--muted);font-size:.95rem}
.pseg .n b{color:var(--ink);font-family:var(--font-code);font-weight:600;font-size:1.15em;font-variant-numeric:tabular-nums;margin-right:.15em}
.c-ph{position:relative}
.c-ph img,.c-ph .noimg{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:4px;background:var(--plate)}
.c-ph .noimg{display:grid;place-items:center;color:var(--tile-muted);font-size:.86rem}
.c-ph .noimg svg{width:64%;height:64%}
/* 沒照片的商品（2026-10-26）：放公司 logo＋請洽電，不留空格 */
.nophoto{display:grid;place-items:center;align-content:center;gap:.7rem;aspect-ratio:4/3;border-radius:6px;background:var(--plate);color:var(--tile-ink);text-align:center;padding:1rem}
.nophoto svg{width:5.5rem;height:5.5rem}
.nophoto p{margin:0;font-size:1.02rem;line-height:1.45;max-width:26em}
/* 已加入詢價單：縮圖右上角小勾（不是新欄） */
.c-ph .ck{display:none;position:absolute;top:-.3rem;right:-.3rem;width:1.3rem;height:1.3rem;border-radius:50%;background:var(--brass);color:var(--on-brass);box-shadow:0 0 0 2px var(--bg);place-items:center}
.c-ph.inq .ck{display:grid}
.c-ph .ck svg{display:block;width:.9rem;height:.9rem}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.plist .c-main{display:flex;flex-direction:column;justify-content:center;gap:.1rem;min-width:0}
.plist .c-side{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:.15rem;min-width:0;text-align:right}
.plist .c-side>.c-qty{order:-1}
.plist .c-name{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;overflow-wrap:anywhere;font-weight:700;line-height:1.3;min-width:0}
.plist .c-car{font-family:var(--font-code);font-weight:600;font-size:1.05em;letter-spacing:.02em;line-height:1.3;overflow-wrap:anywhere}
.plist .c-spec{line-height:1.3;overflow-wrap:anywhere}
.plist .c-brand{color:var(--muted);line-height:1.3}
.c-qty{text-align:right;font-family:var(--font-code);font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25}
.c-qty .qa,.c-qty .qb{white-space:nowrap}
.c-qty .u{font-family:var(--font-body);font-weight:400;font-size:.9em;margin-left:.12em}
.c-qty .qb{color:var(--muted)}
.phead .c-name,.phead .c-car,.phead .c-qty,.phead .c-brand{font-family:var(--font-body);font-weight:500;font-size:1em;letter-spacing:0;color:var(--muted)}
.dash{color:var(--muted);font-weight:400}
@supports (grid-template-columns:subgrid){
  @container view (min-width:34em){
    .plist{grid-template-columns:var(--wc);column-gap:.8rem}
    .plist .c-main,.plist .c-side{display:contents}
    .plist .c-side>.c-qty{order:0}
    .plist .c-name{font-weight:500}
    .plist .c-car{white-space:nowrap;overflow-wrap:normal}
    .plist .c-spec{overflow-wrap:normal;word-break:keep-all}
    .plist .c-spec.brk{overflow-wrap:anywhere}
    .plist .c-brand{color:inherit;white-space:nowrap}
  }
}
@supports not (grid-template-columns:subgrid){
  .prow{grid-template-columns:96px minmax(0,1fr) 5.4em;column-gap:.7rem}
}

/* ── 商品頁：照片 → 品名＋車種＋現有（一行）→ 兩顆鈕 → 事實表 → 同車種／同品名 ── */
.pnav{display:flex;flex-wrap:wrap;align-items:center;gap:0 1.2rem;margin:-.4rem 0 .4rem}
.pnav .crumbs{font-size:1.1rem}
.pnav .crumbs a{padding-inline:.55rem}
.pp-top{display:grid;gap:1rem}
@media (min-width:760px){.pp-top{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start;gap:1.6rem}}
.pp-top>*{min-width:0}
.gallery{position:relative}
/* 商品頁照片轉盤（業主 2026-10-26：不要橫拉軸，像翻圖那樣一次一張左右滑）：捲軸藏起來、snap 一張一張、兩側 ‹ › 鈕 */
.strip{display:flex;gap:0;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;border-radius:6px;scroll-behavior:smooth}
.strip::-webkit-scrollbar{display:none}
.shot{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:4/3;max-width:100%;padding:0;border:0;border-radius:6px;overflow:hidden;background:var(--plate);cursor:zoom-in}
.strip.multi .shot{flex-basis:100%}
.parr{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:2.6rem;height:3.2rem;border:0;border-radius:6px;background:var(--scrim);color:var(--lb-ink);font-size:1.9rem;line-height:1;cursor:pointer;opacity:.85}
.parr.prev{left:.35rem}.parr.next{right:.35rem}
.parr:disabled{opacity:.25;cursor:default}
.shot img{display:block;width:100%;height:100%;object-fit:contain}
.shotn{position:absolute;right:.5rem;bottom:.5rem;padding:.1rem .55rem;border-radius:4px;background:var(--scrim);color:var(--lb-ink);font-family:var(--font-code);font-weight:600;font-size:.9rem;pointer-events:none}
.nophoto{display:grid;place-items:center;aspect-ratio:4/3;max-width:100%;border-radius:6px;background:var(--plate);color:var(--tile-muted)}
@media (max-width:759px){.shot,.nophoto{aspect-ratio:5/3}}  /* 小螢幕：照片高＝寬的 0.6 */
.pline{display:flex;flex-wrap:wrap;align-items:baseline;gap:.15rem 1rem;margin:.1rem 0 .8rem}
.ptitle{margin:0;min-width:0;font-size:1.55rem;line-height:1.3;font-weight:700;overflow-wrap:anywhere}
.pcar{font-family:var(--font-code);font-weight:600;font-size:1.45rem;letter-spacing:.02em;overflow-wrap:anywhere}
.pqty{display:inline-flex;align-items:baseline;gap:.4rem;color:var(--muted)}
.pqty .qcells{color:var(--ink)}
.actw{container-type:inline-size;margin:0 0 1.1rem}
.actions{display:grid;grid-template-columns:minmax(0,1fr);gap:.7rem}
@container (min-width:19em){.actions:not(.one){grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.actions .btn{min-height:3.6rem;min-width:0}
.actions .btn.dark{flex-direction:column;gap:0}
.actions .tel{white-space:normal;overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:5.2em minmax(0,1fr);margin:0;border-top:2px solid var(--rule)}
.facts dt,.facts dd{display:flex;align-items:center;min-height:3rem;margin:0;padding:.45rem .15rem;border-bottom:1px solid var(--line)}
.facts dt{color:var(--muted);font-size:.92rem}
.facts dd{font-size:1.1rem;font-weight:500;min-width:0;overflow-wrap:anywhere}
.facts dd.code{font-size:1.22rem}
.facts dd.sel{user-select:text;-webkit-user-select:text;color:var(--muted);font-size:1.05rem}
/* 適用車種（item_car 共用車）：每個代號一顆，有在站上的可點去那個車種 */
.facts dd.fits{flex-wrap:wrap;gap:.3rem .45rem;padding-block:.5rem}
.facts dd.fits a,.facts dd.fits span{display:inline-flex;align-items:center;min-height:2.2rem;padding:0 .6rem;border-radius:5px;background:var(--plate);color:var(--ink);font-family:var(--font-code);font-weight:600;font-size:1.05rem;letter-spacing:.02em;text-decoration:none}
.facts dd.fits a{color:var(--brass-ink);border:2px solid var(--field-line)}
/* 品牌原字：小字（業主 Q4A「原字放小字」）；自己一列、一格一個值 */
.facts dt.raw,.facts dd.raw{min-height:2.4rem;padding-block:.3rem}
.facts dd.raw{color:var(--muted);font-size:.9rem;font-weight:400}
/* 現有：純文字，兩種單位各自一格 */
.qcells{display:flex;flex-wrap:wrap;align-items:baseline;gap:.2rem .7rem}
.qcell{display:inline-flex;align-items:baseline;gap:.25em;white-space:nowrap}
.qcell .n{font-family:var(--font-code);font-weight:600;font-size:1.3rem;font-variant-numeric:tabular-nums}
.qcells .plus{color:var(--muted)}
.rel{margin-top:1.8rem}
/* 業主 2026-10-26 第 8、9 點：標題帶車種／品名，而且往下滑時卡在頂端列下面 */
.rel h2{display:flex;align-items:baseline;flex-wrap:wrap;gap:.2rem .6rem;margin:0 0 .4rem;padding:.35rem 0;font-size:1.15rem;position:sticky;top:calc(var(--top-h,0px) - 1px);z-index:5;background:var(--bg);box-shadow:0 -1px 0 var(--bg)}
.rel h2 .k{min-width:0;overflow-wrap:anywhere}
.rel h2 .k b{margin:0 .25em}
.rel h2 .n{color:var(--muted);font-weight:500;font-size:.85rem}
.rel h2 .n b{color:var(--ink);font-family:var(--font-code);font-size:1.15em}
.none{margin:0;padding:.7rem .2rem;border-top:2px solid var(--rule);color:var(--muted)}
.empty{padding:1.2rem 0;border-top:2px solid var(--rule)}
.empty p{margin:0 0 1rem;font-size:1.15rem;font-weight:700}
.empty .row{display:flex;flex-wrap:wrap;gap:.6rem}
.empty .row .btn{flex-wrap:wrap;column-gap:.45rem;row-gap:0;min-width:0;max-width:100%;overflow-wrap:anywhere}
.empty .row .btn>*{min-width:0}
.empty .hint{margin:.9rem 0 0;font-size:.95rem;font-weight:400;color:var(--muted)}
.empty .more{margin-top:.9rem}
/* 「用 LINE 問：『…』有沒有」：引號那段整組換行，最後一個字和「』有沒有」黏在一起，不會單獨一個字掉到下一行 */
.empty .ib{display:inline-block;max-width:100%}
.nw{white-space:nowrap}

/* ── 詢價條：左邊常駐打電話，右邊詢價單（點了打開詢價單） ── */
.fback{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(4.6rem + env(safe-area-inset-bottom,0px));z-index:29;display:inline-flex;align-items:center;gap:.25rem;min-height:48px;padding:.35rem 1rem .35rem .75rem;border:2px solid var(--brass);border-radius:999px;background:var(--head);color:var(--head-ink);font-weight:700;font-size:1rem;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.4);opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .18s,transform .18s}
.fback .ar{font-size:1.35em;line-height:1}
.fback.show{opacity:1;transform:none;pointer-events:auto}
html.lock .fback{display:none}
.qbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--head);color:var(--head-ink);border-top:3px solid var(--brass);padding-bottom:env(safe-area-inset-bottom,0px)}
.qbar .inner{display:flex;align-items:stretch;gap:.55rem;padding-block:.4rem}
/* 兩顆同高的鈕：打電話（深色）＋詢價單（有東西＝黃銅；0 項＝深色白字「還沒選零件」，不用灰字）。字放大時各自在鈕內折行 */
.qbtel,.qbar #qbarBtn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;min-height:3.2rem;min-width:0;padding:.2rem .8rem;border:0;border-radius:6px;font-weight:700;font-size:1.05rem;line-height:1.25;text-align:center;text-decoration:none}
.qbtel{flex:0 1 auto;background:var(--btn2);color:var(--btn2-ink)}
.qbtel svg{flex:none;width:1.15em;height:1.15em}
.qbar #qbarBtn{flex:1 1 0;background:var(--brass);color:var(--on-brass)}
.qbar.zero #qbarBtn{background:var(--btn2);color:var(--btn2-ink)}
.qlab{min-width:0;overflow-wrap:anywhere}
.qbar .qn{font-family:var(--font-code);font-size:1.3em;font-variant-numeric:tabular-nums;margin-inline:.2em}
.qbar .go{flex:none;font-size:1.3em;line-height:1}
.qbar .inner{container-type:inline-size}
@container (max-width:16em){
  .qbtel{flex-direction:column;gap:0;padding-inline:.5rem}
  .qbar #qbarBtn{padding-inline:.5rem}
}

/* ── 詢價單覆蓋層 ── */
.sheet{position:fixed;inset:0;z-index:50;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet:focus{outline:none}
.sheet-top{position:sticky;top:0;z-index:2;background:var(--head);color:var(--head-ink);padding-top:env(safe-area-inset-top,0px)}
.sheet-top .inner{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:3.6rem;padding-block:.3rem}
.sheet-top h2{margin:0;font-size:1.25rem}
.sheet-top h2 b{font-family:var(--font-code);color:var(--brass);font-size:1.25em;margin-inline:.2em}
.sheet-top .btn{background:var(--btn2);color:var(--btn2-ink)}
.sheet-top .tools{display:flex;gap:.5rem;flex:none}
.sheet-top .btn.warn{background:transparent;border-color:var(--brass);color:var(--brass)}
.sheet-body{padding-block:1rem 1.6rem}
/* 每筆兩行：品名……移除 ／ 車種｜規格｜現有（2026-10-26 業主：不填數量、不印內部編號，之後電話談） */
.qgrid{display:grid;grid-template-columns:fit-content(7em) minmax(0,1fr) max-content;column-gap:.7rem;border-top:2px solid var(--rule)}
.qrow{grid-column:1/-1;display:grid;grid-template-columns:subgrid;align-items:center;row-gap:.3rem;padding-block:.55rem;border-bottom:1px solid var(--line)}
.qrow>*{min-width:0}
.qrow .c-name{grid-column:1/3;grid-row:1;font-weight:700;overflow-wrap:anywhere;line-height:1.35}
.qrow .q-rm{grid-column:3;grid-row:1;justify-self:end}
.qrow .c-car{grid-column:1;grid-row:2;font-family:var(--font-code);font-weight:600;font-size:1.05em;letter-spacing:.02em;overflow-wrap:anywhere}
.qrow .c-spec{grid-column:2;grid-row:2;overflow-wrap:anywhere;line-height:1.3}
.qgrid.nospec .c-car{grid-column:1/3}
.qrow .c-qty{grid-column:3;grid-row:2}
.qrow.qhead{padding-block:.35rem;row-gap:0;color:var(--muted);font-size:.86rem}
.qrow.qhead .c-name,.qrow.qhead .c-car,.qrow.qhead .c-qty{font-family:var(--font-body);font-weight:500;font-size:1em;letter-spacing:0}
.q-rm{display:inline-flex;align-items:center;justify-content:center;min-height:48px;min-width:48px;padding:0 .2rem;border:0;background:transparent;color:var(--brass-ink);font-weight:700;font-size:.95rem;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.22em}

function parse(h) {
  var m;

  if (!READY) return { v: 'wait' };   /* 全部商品資料還沒載到：先畫「載入中」，到了再畫真的那一頁 */
  if (h === 's') return { v: 's' };
  if ((m = /^s-(\d+)$/.exec(h)) && SERIES[+m[1]]) return { v: 'cars', si: +m[1] };
  if ((m = /^c-(\d+)-(\d+)$/.exec(h)) && SERIES[+m[1]] && SERIES[+m[1]].cars[+m[2]]) return { v: 'car', si: +m[1], ci: +m[2] };

  if ((m = /^k-(\d+)-(\d+)$/.exec(h)) && KINDS[+m[1]] && KINDS[+m[1]].names[+m[2]]) return { v: 'kindname', ki: +m[1], ni: +m[2] };

var fback = document.getElementById('fback'), fbackObs = null;
/* --top-h＝頂端列的實際底緣（業主 2026-10-26 晚：卡頂標題與頂端列之間不要有縫）：
   取 getBoundingClientRect().bottom（含安全區、sticky 位移、字放大），捲動／表頭變高時重量；CSS 再往上疊 1px 蓋掉半像素縫 */
var topEl = document.querySelector('.top'), topHLast = -1;
function setTopH() {
  var r = topEl ? topEl.getBoundingClientRect() : null, b = r ? Math.max(r.bottom, r.height) : 0;
  if (Math.abs(b - topHLast) > 0.01) { topHLast = b; document.documentElement.style.setProperty('--top-h', b + 'px'); }

  if (fbackObs) { fbackObs.disconnect(); fbackObs = null; }

}

function copyText(text, cb) {
  function fallback() {
    var ok = false, ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.left = '0'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    try { ta.select(); ta.setSelectionRange(0, text.length); ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);

      return;
    }
  } catch (e) {}

}

  if (LINE_ID && t) { qline.href = LINE_MSG + encodeURIComponent(t); qline.removeAttribute('aria-disabled'); }
  else { qline.removeAttribute('href'); qline.setAttribute('aria-disabled', 'true'); }
  if (WA_BASE) qwa.href = WA_BASE + (t ? '?text=' + encodeURIComponent(t) : '');
  if (EMAIL) qmail.href = mailHref(t);
}
/* 剛移除的那一筆：5 秒內顯示「已移除・復原」 */
var UNDO = null;
function undoRow() {
  if (!UNDO) return '';
  var t;
  if (UNDO.all) t = T('cleared_n', { n: UNDO.all.length });
  else { var x = byId.get(UNDO.e.id); t = T('removed_x', { x: nmv(x.name) + (has(x.car_code) ? ' <span class="code">' + esc(x.car_code) + '</span>' : '') }); }
  return '<div class="qundo" role="row"><span class="t" role="cell">' + t + '</span>' +
    '<button type="button" class="btn small line" data-undo="1">' + T('undo') + '</button></div>';
}
function clearUndo() {
  if (!UNDO) return;
  clearTimeout(UNDO.t); UNDO = null;
  var el = sheetList.querySelector('.qundo');
  if (el) el.parentNode.removeChild(el);
}
function drawSheet() {
  updateBar();
  qcopy.disabled = INQ.length === 0 || !READY;
  qclearBtn.hidden = INQ.length === 0 || !READY;
  setLinks();
  if (!READY) { sheetList.innerHTML = '<p class="qempty">' + (LOAD_ERR ? T('load_err2') : T('loading')) + '</p>'; return; }
  if (!INQ.length) { sheetList.innerHTML = '<p class="qempty">' + T('qbar_none') + '</p>' + (UNDO ? '<div class="qgrid">' + undoRow() + '</div>' : ''); return; }
  var withSpec = INQ.some(function (e) { var x = byId.get(e.id); return has(x.spec) || has(x.year); });
  var h = '<div class="qgrid' + (withSpec ? '' : ' nospec') + '" role="table"><div class="qrow qhead" role="row"><span class="c-name" role="columnheader">' + T('col_name') + '</span>' +
    '<span class="c-car" role="columnheader">' + T('col_car') + '</span>' + (withSpec ? '<span class="c-spec" role="columnheader">' + T('col_spec') + '</span>' : '') + '<span class="c-qty" role="columnheader">' + T('col_stock') + '</span></div>';
  INQ.forEach(function (e, i) {
    if (UNDO && UNDO.i === i) h += undoRow();
    var x = byId.get(e.id);
    h += '<div class="qrow" role="row">' +
      '<span class="c-name" role="cell">' + nmv(x.name) + '</span>' +
      '<button type="button" class="q-rm" data-rm="' + esc(x.id) + '" aria-label="' + T('remove_aria', { n: esc(nameTxt(x.name)) }) + '">' + T('remove') + '</button>' +
      '<span class="c-car" role="cell">' + val(x.car_code) + '</span>' +
      (withSpec ? '<span class="c-spec" role="cell">' + specYear(x) + '</span>' : '') +
      '<span class="c-qty" role="cell">' + qtyList(x) + '</span></div>';
  });
  if (UNDO && UNDO.i >= INQ.length) h += undoRow();
  sheetList.innerHTML = h + '</div>';
}
/* 詢價文字（業主 2026-10-26 兩次指正）：五大標籤 品名 車種 規格 品牌 年份；不填數量、不印內部編號；
   不用「｜」分隔，用空格把每一欄排齊（中文字算 2 格、英數算 1 格，差額用全形空白補）。
   例：
   1. 排氣煞車　　P11C　E)2342　　　外匯
   2. 電動邦浦　　0　　 附座　　　　MANDO
   LINE 的字不是等寬，只能盡量齊；空欄位留空、欄寬照最長的那一筆 */
function dispW(str) { var w = 0; for (var i = 0; i < str.length; i++) w += str.charCodeAt(i) > 255 ? 2 : 1; return w; }
function padTo(str, w) { var d = w - dispW(str); if (d <= 0) return str; var out = str; while (d >= 2) { out += '\u3000'; d -= 2; } if (d === 1) out += ' '; return out; }
function inquiryText() {
  var rows = INQ.map(function (e) {
    var x = byId.get(e.id);
    return [x.name, x.car_code, x.spec, x.brand, x.year].map(function (v) { return has(v) ? String(v).trim() : ''; });
  });
  var cols = 5, widths = [];
  for (var c = 0; c < cols; c++) { var m = 0; rows.forEach(function (r) { m = Math.max(m, dispW(r[c])); }); widths.push(m); }
  var last = cols - 1; while (last > 0 && widths[last] === 0) last--;
  var lines = rows.map(function (r, i) {
    var cells = [];
    for (var c = 0; c <= last; c++) cells.push(c === last ? r[c] : padTo(r[c], widths[c] + 2));
    return padTo((i + 1) + '.', rows.length >= 10 ? 4 : 3) + cells.join('').replace(/[\s\u3000]+$/, '');
  });
  return '禾賀清倉詢價\n' + lines.join('\n') + '\n—— 請回覆報價，謝謝';
}
function openSheet() {
  if (!sheet.hidden) return;
  qmsg.textContent = ''; qtext.hidden = true;
  clearUndo();
  drawSheet();
  sheet.hidden = false;
  document.documentElement.classList.add('lock');
  sheet.scrollTop = 0;
  try { sheet.focus({ preventScroll: true }); } catch (e) {}
}
function closeSheet() {
  if (sheet.hidden) return;
  sheet.hidden = true;
  clearUndo();
  if (lb.hidden && flip.hidden) document.documentElement.classList.remove('lock');
  updateAddBtn(); refreshMarks();
}
document.getElementById('qbarBtn').addEventListener('click', function () { go('q'); });
document.getElementById('qsheetClose').addEventListener('click', goBack);
/* 一鍵清空（業主 2026-10-26 第 4 點）：不跳確認框，5 秒內可按「復原」整批救回 */
var qclearBtn = document.getElementById('qclearBtn');
qclearBtn.addEventListener('click', function () {
  if (!INQ.length) return;
  clearUndo();
  UNDO = { all: INQ.slice(), t: setTimeout(clearUndo, UNDO_MS) };
  INQ = [];
  afterInqChange();
  live.textContent = T('live_cleared');
  var ub = sheetList.querySelector('[data-undo]');
  if (ub) { try { ub.focus({ preventScroll: true }); } catch (err) {} }
});
function afterInqChange() {
  saveInq(); drawSheet(); updateAddBtn(); refreshMarks();
  qmsg.textContent = '';
  if (!qtext.hidden) { if (INQ.length) qtext.value = inquiryText(); else qtext.hidden = true; }
}
sheetList.addEventListener('click', function (e) {
  var u = e.target.closest('[data-undo]');
  if (u && UNDO) {
    var d = UNDO; clearUndo();
    if (d.all) INQ = d.all.concat(INQ.filter(function (q) { return !d.all.some(function (a) { return a.id === q.id; }); }));
    else if (!inInq(d.e.id)) INQ.splice(Math.min(d.i, INQ.length), 0, d.e);
    afterInqChange();
    live.textContent = T('live_restored');
    return;
  }
  var b = e.target.closest('[data-rm]');
  if (!b) return;
  var id = b.getAttribute('data-rm'), idx = -1;
  INQ.forEach(function (q, i) { if (q.id === id) idx = i; });
  if (idx < 0) return;
  clearUndo();
  UNDO = { e: INQ[idx], i: idx, t: setTimeout(clearUndo, UNDO_MS) };
  INQ.splice(idx, 1);
  afterInqChange();
  live.textContent = T('live_removed');
  var ub = sheetList.querySelector('[data-undo]');
  if (ub) { try { ub.focus({ preventScroll: true }); } catch (err) {} }
});
function selectAll(el) {
  try {
    if (el.tagName === 'TEXTAREA') { el.focus(); el.select(); el.setSelectionRange(0, el.value.length); return; }
    var r = document.createRange(); r.selectNodeContents(el);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  } catch (e) {}
}
function copyWith(text, el, okMsg, prep) {
  function fallback() {
    if (prep) prep();
    selectAll(el);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    qmsg.textContent = ok ? okMsg : T('sel_copy');
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { qmsg.textContent = okMsg; }, fallback);
      return;
    }
  } catch (e) {}
  fallback();
}
qcopy.addEventListener('click', function () {
  if (!INQ.length || !READY) return;
  var t = inquiryText();
  copyWith(t, qtext, LINE_ID ? T('copied_line') : T('copied_msg'), function () { qtext.value = t; qtext.hidden = false; });
});
qmailCopy.addEventListener('click', function () {
  if (!EMAIL) return;
  copyText(EMAIL, function (ok) { qmsg.textContent = ok ? T('copied_mail') + EMAIL : T('longpress_mail'); });
});

/* 翻圖功能已拿掉（業主 2026-10-26 第 6 點）；留空殼讓舊的 lock 判斷不用改 */
var flip = { hidden: true };
function closeFlip() {}
function openFlip() {}

/* ── 照片放大：點兩下 2 倍（以點的位置為中心，放大後可拖著看），再點兩下還原；兩指縮放交給瀏覽器 ── */
var lb = document.getElementById('lb'), lbStrip = document.getElementById('lbStrip'), lbN = document.getElementById('lbN');
var lbIdx = 0;
function lbCur() { return Math.min(lbStrip.children.length - 1, Math.round(lbStrip.scrollLeft / Math.max(1, lbStrip.clientWidth))); }
function unzoom(slide) {
  slide.classList.remove('z');
  var img = slide.querySelector('img');
  if (img) { img.style.width = ''; img.style.height = ''; img.style.margin = ''; }
  slide.scrollLeft = 0; slide.scrollTop = 0;
}
function toggleZoom(img, cx, cy) {
  var slide = img.parentNode;
  if (slide.classList.contains('z')) { unzoom(slide); return; }
  var r = img.getBoundingClientRect(), sr = slide.getBoundingClientRect();
  if (!r.width || !r.height) return;
  var px = Math.min(1, Math.max(0, (cx - r.left) / r.width)), py = Math.min(1, Math.max(0, (cy - r.top) / r.height));
  var w = r.width * 2, h = r.height * 2;
  var mx = Math.max(0, (sr.width - w) / 2), my = Math.max(0, (sr.height - h) / 2);
  slide.classList.add('z');
  img.style.width = w + 'px'; img.style.height = h + 'px'; img.style.margin = my + 'px ' + mx + 'px';
  slide.scrollLeft = mx + px * w - (cx - sr.left);
  slide.scrollTop = my + py * h - (cy - sr.top);
}
function lbCount() {
  var n = lbStrip.children.length, i = lbCur();
  if (i !== lbIdx) { lbStrip.querySelectorAll('.lb-slide.z').forEach(unzoom); lbIdx = i; }
  lbN.textContent = n < 2 ? '' : (i + 1) + ' / ' + n;
}
function openLB(i) {
  if (!curItem || !curItem.photos || !curItem.photos.length) return;
  var x = curItem;
  lbStrip.innerHTML = x.photos.map(function (p, k) { return '<div class="lb-slide"><img src="photos/' + esc(p) + '" alt="' + esc(nameTxt(x.name)) + T('photo_n', { n: k + 1 }) + '" draggable="false"></div>'; }).join('');
  lb.hidden = false;
  document.documentElement.classList.add('lock');
  lbStrip.style.scrollBehavior = 'auto';
  lbStrip.scrollLeft = i * lbStrip.clientWidth;
  lbStrip.style.scrollBehavior = '';
  lbIdx = i;
  lbCount();
  try { document.getElementById('lbClose').focus({ preventScroll: true }); } catch (e) {}
}
function closeLB() {
  if (lb.hidden) return;
  lb.hidden = true; lbStrip.innerHTML = '';
  if (sheet.hidden && flip.hidden) document.documentElement.classList.remove('lock');
}
lbStrip.addEventListener('scroll', lbCount, { passive: true });
/* 觸控點兩下：自己量（手機上不一定有 dblclick）；滑動時瀏覽器會送 pointercancel，不會被當成點 */
var tapT = 0, tapX = 0, tapY = 0, lastTouch = 0;
lbStrip.addEventListener('pointerup', function (e) {
  if (e.pointerType === 'mouse') return;
  lastTouch = Date.now();
  var img = e.target.closest && e.target.closest('.lb-slide img');
  if (!img) { tapT = 0; return; }
  var now = Date.now();
  if (now - tapT < 350 && Math.abs(e.clientX - tapX) < 30 && Math.abs(e.clientY - tapY) < 30) { tapT = 0; toggleZoom(img, e.clientX, e.clientY); }
  else { tapT = now; tapX = e.clientX; tapY = e.clientY; }
});
lbStrip.addEventListener('dblclick', function (e) {
  if (Date.now() - lastTouch < 800) return;
  var img = e.target.closest('.lb-slide img');
  if (img) { e.preventDefault(); toggleZoom(img, e.clientX, e.clientY); }
});
/* 點照片本身不關；點黑底才關（放大中點黑底也不關，避免拖著看時誤關） */
lb.addEventListener('click', function (e) {
  if (e.target.closest('.lb-x')) { closeLB(); return; }
  if (e.target.closest('.lb-slide img') || lbStrip.querySelector('.lb-slide.z')) return;
  closeLB();
});
document.addEventListener('keydown', function (e) {
  if (!lb.hidden) {
    if (e.key === 'Escape') { e.preventDefault(); closeLB(); }
    else if (e.key === 'ArrowRight') lbStrip.scrollBy({ left: lbStrip.clientWidth });
    else if (e.key === 'ArrowLeft') lbStrip.scrollBy({ left: -lbStrip.clientWidth });
    return;
  }
  if (!sheet.hidden && e.key === 'Escape') { e.preventDefault(); goBack(); }
});

/* ── 頁面內點擊 ── */
view.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act],[data-lb],[data-copy],[data-kind],[data-wsort],[data-tadd],[data-pstep],#addq');
  if (!t) return;
  if (t.hasAttribute('data-pstep')) { var ps = document.getElementById('pstrip'); if (ps) ps.scrollBy({ left: ps.clientWidth * Number(t.getAttribute('data-pstep')), behavior: 'smooth' }); return; }
  if (t.hasAttribute('data-kind')) { wallKind = t.getAttribute('data-kind'); wallReset(); redrawWall(false); return; }
  if (t.hasAttribute('data-wsort')) { wallSort = t.getAttribute('data-wsort'); wallReset(); redrawWall(false); return; }
  if (t.hasAttribute('data-tadd')) { var tid = t.getAttribute('data-tadd'); if (inInq(tid)) go('q'); else { addInq(tid); live.textContent = T('added_live'); } return; }
  if (t.id === 'addq') { var id = t.getAttribute('data-id'); if (inInq(id)) go('q'); else addInq(id); return; }
  if (t.hasAttribute('data-lb')) { openLB(+t.getAttribute('data-lb')); return; }
  if (t.hasAttribute('data-copy')) { copyText(t.getAttribute('data-copy'), function (ok) { flash(t, ok ? T('copied') : T('longpress')); }); return; }
  var act = t.getAttribute('data-act');
  if (act === 'back') goBack();
  else if (act === 'clearsearch') clearSearch();
  else if (act === 'wallmore') wallMore();
  else if (act === 'wallall') wallShowAll();
  else if (act === 'retry') { LOAD_ERR = false; drawMain(mainHash, false, true); loadCatalog(); }
});

window.addEventListener('hashchange', onNav);
function onLangChange() {
  if (mainHash !== null) drawMain(mainHash, true, true);
  drawSheet();
  fitPh();
}
setupContacts();
updateBar();
onNav();
loadCatalog();
})();
</script>
