<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#1D2327" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0D0F" media="(prefers-color-scheme: dark)">
<title>禾賀清倉零件</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='8,2 24,2 31,16 24,30 8,30 1,16' fill='%23C9952E'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%231D2327'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：單欄工作台。鑄鐵色頂列（店名＋搜尋）壓住鋼板灰工作面；清單共用一條格線；底部常駐詢價條。強調色只有黃銅。 */
:root{
  --bg:#E4E8EA;          /* 鋼板灰 */
  --surface:#F5F7F8;
  --ink:#14181B;         /* 機油黑 */
  --muted:#56616A;
  --line:#C3CBD1;
  --rule:#14181B;
  --head:#1D2327;        /* 鑄鐵 */
  --head-ink:#EDF0F2;
  --head-muted:#9DA8B0;
  --tile:#232A2F;
  --tile-ink:#F1F3F4;
  --tile-muted:#A9B3BA;
  --tile-line:#3B454C;
  --brass:#C9952E;       /* 黃銅 */
  --brass-ink:#7A540F;
  --on-brass:#16130C;
  --btn2:#2B3338;
  --btn2-ink:#F1F3F4;
  --field:#FFFFFF;
  --field-ink:#14181B;
  --field-ph:#6E7880;
  --field-line:#6E7880;  /* 輸入框邊（對背景 ≥3:1） */
  --search-line:#FFFFFF;
  --plate:#2A3135;
  --row-hover:#D9DFE3;
  --scrim:rgba(8,10,12,.94);
  --lb-ink:#F1F3F4;
  --font-body:"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-code:"Barlow Semi Condensed","Noto Sans TC","Arial Narrow","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101316; --surface:#181D21; --ink:#E6EAEC; --muted:#9AA5AD; --line:#2B3339; --rule:#56616A;
    --head:#0A0D0F; --head-ink:#E6EAEC; --head-muted:#8C979F;
    --tile:#1E252A; --tile-ink:#EEF1F2; --tile-muted:#9AA5AD; --tile-line:#343D43;
    --brass:#D6A646; --brass-ink:#E4BA62; --on-brass:#15110A;
    --btn2:#2A3237; --btn2-ink:#EEF1F2;
    --field:#1C2226; --field-ink:#EEF1F2; --field-ph:#86929A; --field-line:#7F8B93; --search-line:#7F8B93;
    --plate:#0B0E10; --row-hover:#1F262B; --scrim:rgba(0,0,0,.95); --lb-ink:#EEF1F2;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101316; --surface:#181D21; --ink:#E6EAEC; --muted:#9AA5AD; --line:#2B3339; --rule:#56616A;
  --head:#0A0D0F; --head-ink:#E6EAEC; --head-muted:#8C979F;
  --tile:#1E252A; --tile-ink:#EEF1F2; --tile-muted:#9AA5AD; --tile-line:#343D43;
  --brass:#D6A646; --brass-ink:#E4BA62; --on-brass:#15110A;
  --btn2:#2A3237; --btn2-ink:#EEF1F2;
  --field:#1C2226; --field-ink:#EEF1F2; --field-ph:#86929A; --field-line:#7F8B93; --search-line:#7F8B93;
  --plate:#0B0E10; --row-hover:#1F262B; --scrim:rgba(0,0,0,.95); --lb-ink:#EEF1F2;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:19px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.lock{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--head)}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a,button,.btn,.entry,.nrow,.prow,label{user-select:none;-webkit-user-select:none}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
img{max-width:100%}
h1,h2{text-wrap:balance}
[hidden]{display:none!important}

.gut{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.inner{max-width:900px;margin-inline:auto}

/* ── 頂列 ── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--head);color:var(--head-ink)}
.top .inner{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:.35rem 1.2rem;padding-block:.45rem .6rem}
.shop{display:inline-flex;align-items:center;gap:.55rem;min-height:48px;text-decoration:none;font-weight:700;font-size:1.12rem;letter-spacing:.06em;white-space:nowrap;justify-self:start}
.shop small{font-size:1rem;font-weight:500;color:var(--head-muted);letter-spacing:.04em}
.nut{flex:none;width:1.35rem;height:1.2rem;clip-path:polygon(25% 2%,75% 2%,100% 50%,75% 98%,25% 98%,0 50%);background:radial-gradient(circle at 50% 50%,var(--head) 0 27%,var(--brass) 30%)}
.search{position:relative;margin:0}
.search svg{position:absolute;left:.75rem;top:50%;width:1.15rem;height:1.15rem;transform:translateY(-50%);color:var(--field-ph);pointer-events:none}
.search input{display:block;width:100%;height:52px;border:2px solid var(--search-line);border-radius:6px;background:var(--field);color:var(--field-ink);padding:0 4.4rem 0 2.4rem;font-size:1.05rem;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--field-ph)}
.search input:placeholder-shown{padding-right:.8rem}  /* 空白時清除鈕不在，讓「原廠號」整段看得到 */
.search input:focus{outline:none;border-color:var(--brass)}
.search input::-webkit-search-cancel-button{display:none}
.kwclear{position:absolute;right:2px;top:2px;bottom:2px;min-width:4rem;border:0;border-radius:0 4px 4px 0;background:transparent;color:var(--brass-ink);font-weight:700;font-size:.95rem}
@media (max-width:719px){.top .inner{grid-template-columns:minmax(0,1fr);gap:.15rem}}

.banner{background:var(--surface);border-bottom:1px solid var(--line);color:var(--muted);font-size:.86rem}
.banner .inner{display:flex;align-items:center;gap:.65rem;padding-block:.3rem;white-space:nowrap}
.banner .inner>span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
.banner b{color:var(--ink);font-weight:700;font-family:var(--font-code);font-size:1.05em}

.main{padding-block:1rem calc(5.4rem + env(safe-area-inset-bottom,0px))}

/* ── 首頁 ── */
.entries{display:grid;gap:.8rem}
@media (min-width:720px){.entries{grid-template-columns:1fr 1fr}}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"k go" "n go" "p p";gap:.15rem 1rem;align-items:center;min-height:7.2rem;padding:1rem 1.1rem 1.05rem;background:var(--tile);color:var(--tile-ink);border-radius:8px;text-decoration:none}
.entry:active{filter:brightness(1.12)}
.e-k{grid-area:k;font-size:1.45rem;font-weight:700;letter-spacing:.03em}
.e-n{grid-area:n;color:var(--tile-muted);font-size:.95rem}
.e-n b{color:var(--brass);font-family:var(--font-code);font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums;margin-right:.2em}
.e-n i{display:inline-block;width:.9em}
.e-p{grid-area:p;margin-top:.45rem;padding-top:.5rem;border-top:1px solid var(--tile-line);color:var(--tile-muted);font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-code);letter-spacing:.02em;min-width:0}
.e-p.cjk{font-family:var(--font-body);letter-spacing:0}
.e-go{grid-area:go;font-size:2.2rem;line-height:1;color:var(--brass)}
.allrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:1rem;min-height:3.6rem;margin-top:.8rem;padding:.5rem 1.1rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;text-decoration:none;font-weight:700;font-size:1.1rem}
.allrow .c{font-weight:500;color:var(--muted)}
.allrow .c b{color:var(--ink);font-family:var(--font-code);font-size:1.15em;font-variant-numeric:tabular-nums}
.allrow .go{color:var(--brass-ink);font-size:1.6rem;line-height:1}
.contact{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:.15rem 1.2rem;margin:1.4rem 0 0;padding-top:.9rem;border-top:2px solid var(--rule);font-size:.95rem}
.contact dt{color:var(--muted)}
.contact dd{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem .9rem;min-height:48px;margin:0;font-family:var(--font-code);font-weight:600;font-size:1.15rem;letter-spacing:.03em}
.contact .sel{user-select:text;-webkit-user-select:text}
.contact a.tl{display:inline-flex;align-items:center;min-height:48px;color:var(--brass-ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.22em}
.contact .btn{font-family:var(--font-body);letter-spacing:0}

/* ── 清單頁頭 ── */
.lhead{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:0 1rem;margin-bottom:.6rem}
.backrow{grid-column:1/-1;display:flex;margin-top:-.4rem}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:0 .4rem;font-size:1.25rem;font-weight:700;min-width:0}
.crumbs a{display:inline-flex;align-items:center;justify-content:center;min-width:48px;min-height:48px;text-decoration:none;color:var(--brass-ink)}
@media (hover:hover){.crumbs a:hover{text-decoration:underline;text-decoration-color:var(--brass);text-underline-offset:.2em}}
@media (max-width:719px){.crumbs .far{display:none}}
.crumbs .sep{color:var(--muted);font-weight:400}
.crumbs .here{min-height:48px;display:inline-flex;align-items:center;min-width:0;overflow-wrap:anywhere}
.code{font-family:var(--font-code);font-weight:600;letter-spacing:.02em}
.lmeta{display:flex;align-items:center;justify-content:flex-end;min-height:48px;gap:.6rem;white-space:nowrap;color:var(--muted);align-self:end}
.lmeta b{color:var(--ink);font-family:var(--font-code);font-size:1.2em;font-variant-numeric:tabular-nums}

/* ── 按鈕 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:3.1rem;padding:.4rem 1.05rem;border-radius:6px;border:2px solid transparent;background:var(--surface);color:var(--ink);font-weight:700;font-size:1.02rem;line-height:1.25;text-decoration:none;text-align:center}
.btn.primary{background:var(--brass);color:var(--on-brass)}
.btn.primary.on{background:transparent;border-color:var(--brass);color:var(--brass-ink)}
.btn.dark{background:var(--btn2);color:var(--btn2-ink)}
.btn.line{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.small{min-height:48px;padding:.3rem .9rem;font-size:.95rem}
.btn.back{min-height:48px;padding:.3rem .1rem;border:0;background:transparent;color:var(--brass-ink);font-size:1rem}
.btn[disabled]{opacity:.45;cursor:default}
.btn:active:not([disabled]){transform:translateY(1px)}
.btn .tel{font-family:var(--font-code);font-weight:600;font-size:1.08rem;letter-spacing:.04em;white-space:nowrap}

/* ── 分類清單（廠牌／車種／品名） ── */
.nlist{display:grid;border-top:2px solid var(--rule)}
@media (min-width:720px){.nlist.two{grid-template-columns:1fr 1fr;column-gap:2rem}}
.nrow{display:grid;grid-template-columns:minmax(0,1fr) max-content;grid-template-areas:"k c" "p c";column-gap:1rem;align-items:center;min-height:3.9rem;padding:.55rem .3rem;border-bottom:1px solid var(--line);text-decoration:none}
.nrow:active{background:var(--row-hover)}
@media (hover:hover){.nrow:hover{background:var(--row-hover)}}
.nrow .k{grid-area:k;font-size:1.2rem;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow .k.code{font-size:1.35rem}
.nrow .p{grid-area:p;color:var(--muted);font-size:.86rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow .c{grid-area:c;text-align:right;color:var(--muted);font-size:.95rem;white-space:nowrap}
.nrow .c b{color:var(--ink);font-family:var(--font-code);font-weight:600;font-size:1.3rem;font-variant-numeric:tabular-nums;margin-right:.15em}

/* ── 商品清單：表頭與每列共用同一條格線（subgrid）。三種欄位組：
   一般＝品名｜車種｜規格｜品牌｜數量；grouped＝依車種分段（段標放車種，段內不印車種）；bycar＝單一車種（品名｜品牌｜規格｜數量） ── */
.plist{--cols:3rem minmax(4em,1fr) max-content fit-content(6em) max-content fit-content(6em);display:grid;grid-template-columns:var(--cols);column-gap:.8rem;border-top:2px solid var(--rule)}
.plist.grouped{--cols:3rem minmax(6em,1fr) fit-content(6em) max-content fit-content(6em)}
.plist.bycar{--cols:3rem minmax(6em,1fr) max-content fit-content(6em) fit-content(6em)}
.prow{grid-column:1/-1;display:grid;grid-template-columns:subgrid;align-items:center;min-height:3.1rem;padding-block:.3rem;border-bottom:1px solid var(--line);text-decoration:none}
a.prow:active{background:var(--row-hover)}
@media (hover:hover){a.prow:hover{background:var(--row-hover)}}
.phead{min-height:2.3rem;padding-block:.2rem;color:var(--muted);font-size:.86rem;font-weight:500}
.pseg{grid-column:1/-1;display:flex;align-items:flex-end;min-height:3rem;padding:.8rem .2rem .25rem;border-bottom:2px solid var(--rule)}
.pseg>span{display:flex;align-items:baseline;gap:.7rem;min-width:0}
.pseg .k{font-family:var(--font-code);font-weight:600;font-size:1.3rem;letter-spacing:.02em;overflow-wrap:anywhere}
.pseg .n{flex:none;color:var(--muted);font-size:.95rem}
.pseg .n b{color:var(--ink);font-family:var(--font-code);font-weight:600;font-size:1.15em;font-variant-numeric:tabular-nums;margin-right:.15em}
.prow>.c-name{min-width:0}
.c-ph{position:relative}
.c-ph img,.c-ph .noimg{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;background:var(--plate)}
.c-ph .noimg{display:grid;place-items:center;color:var(--tile-muted);font-size:.86rem}
/* 已加入詢價單：縮圖右上角小勾（不是新欄） */
.c-ph .ck{display:none;position:absolute;top:-.3rem;right:-.3rem;width:1.3rem;height:1.3rem;border-radius:50%;background:var(--brass);color:var(--on-brass);box-shadow:0 0 0 2px var(--bg);place-items:center}
.c-ph.inq .ck{display:grid}
.c-ph .ck svg{display:block;width:.9rem;height:.9rem}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.c-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.c-car{white-space:nowrap;font-family:var(--font-code);font-weight:600;font-size:1.05em;letter-spacing:.02em}
.c-spec{white-space:normal;overflow-wrap:normal;word-break:keep-all;line-height:1.25}
.c-spec.brk{overflow-wrap:anywhere}
.c-brand{white-space:nowrap}
.c-qty{text-align:right;font-family:var(--font-code);font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25}
.c-qty .qa,.c-qty .qb{white-space:nowrap}
.c-qty .u{font-family:var(--font-body);font-weight:400;font-size:.9em;margin-left:.12em}
.c-qty .qb{color:var(--muted)}
.phead .c-car,.phead .c-qty{font-family:var(--font-body);font-weight:500;font-size:1em;letter-spacing:0}
.dash{color:var(--muted);font-weight:400}
@media (max-width:480px){
  .plist{--cols:2.3rem minmax(3em,1fr) max-content fit-content(3.6em) fit-content(2.8em);column-gap:.55rem}
  .plist.grouped{--cols:2.3rem minmax(6.2em,1fr) fit-content(4.2em) fit-content(3.4em)}
  .plist.bycar{--cols:2.3rem minmax(4em,1fr) fit-content(4em) fit-content(3.6em) fit-content(2.8em);column-gap:.45rem}
  .plist:not(.bycar) .c-brand{display:none}
  .plist.bycar .c-brand{overflow:hidden;text-overflow:ellipsis}
  .prow:not(.phead){font-size:.95rem}
  .c-car{letter-spacing:0}
}
@media (max-width:360px){
  .plist{--cols:2rem minmax(2.4em,1fr) fit-content(4.4em) fit-content(3.2em) fit-content(2.6em);column-gap:.35rem}
  .plist.grouped{--cols:2rem minmax(5.8em,1fr) fit-content(4em) fit-content(3.2em)}
  .plist.bycar{--cols:2rem minmax(3.4em,1fr) fit-content(3.4em) fit-content(3.4em) fit-content(2.6em);column-gap:.35rem}
  .c-car{white-space:normal}
}
@supports not (grid-template-columns:subgrid){
  .prow{grid-template-columns:3rem minmax(0,1fr) 5.5em 5.5em 6em 5.5em;column-gap:.8rem}
  .plist.grouped .prow{grid-template-columns:3rem minmax(0,1fr) 6em 5.5em 5.5em}
  .plist.bycar .prow{grid-template-columns:3rem minmax(0,1fr) 5.5em 6em 5.5em}
  @media (max-width:480px){
    .prow{grid-template-columns:2.3rem minmax(0,1fr) 4.6em 3.8em 3em;column-gap:.45rem}
    .plist.grouped .prow{grid-template-columns:2.3rem minmax(0,1fr) 4.2em 3.4em}
    .plist.bycar .prow{grid-template-columns:2.3rem minmax(0,1fr) 4em 3.6em 2.8em}
  }
}

/* ── 商品頁 ── */
.pnav{display:flex;flex-wrap:wrap;align-items:center;gap:0 1.2rem;margin:-.4rem 0 .4rem}
.pnav .crumbs{font-size:1.1rem}
.pnav .crumbs a{padding-inline:.55rem}
.pp-top{display:grid;gap:1rem}
@media (min-width:760px){.pp-top{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start;gap:1.6rem}}
.pp-top>*{min-width:0}
.gallery{position:relative}
.strip{display:flex;gap:.5rem;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:thin;border-radius:6px}
.shot{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:4/3;max-width:100%;padding:0;border:0;border-radius:6px;overflow:hidden;background:var(--plate);cursor:zoom-in}
.strip.multi .shot{flex-basis:88%}
.shot img{display:block;width:100%;height:100%;object-fit:contain}
.shotn{position:absolute;right:.5rem;bottom:.5rem;padding:.1rem .55rem;border-radius:4px;background:var(--scrim);color:var(--lb-ink);font-family:var(--font-code);font-weight:600;font-size:.9rem;pointer-events:none}
.nophoto{display:grid;place-items:center;aspect-ratio:4/3;max-width:100%;border-radius:6px;background:var(--plate);color:var(--tile-muted)}
.ptitle{margin:.1rem 0 .6rem;font-size:1.6rem;line-height:1.3;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.facts{display:grid;grid-template-columns:5.2em minmax(0,1fr);margin:0;border-top:2px solid var(--rule)}
.facts dt,.facts dd{display:flex;align-items:center;min-height:3rem;margin:0;padding:.45rem .15rem;border-bottom:1px solid var(--line)}
.facts dt{color:var(--muted);font-size:.92rem}
.facts dd{font-size:1.1rem;font-weight:500;min-width:0;overflow-wrap:anywhere}
.facts dd.code{font-size:1.22rem}
.facts dd.sel{user-select:text;-webkit-user-select:text;color:var(--muted);font-size:1.05rem}
/* 現有：純文字，兩種單位各自一格 */
.qcells{display:flex;flex-wrap:wrap;align-items:baseline;gap:.2rem .7rem}
.qcell{display:inline-flex;align-items:baseline;gap:.25em;white-space:nowrap}
.qcell .n{font-family:var(--font-code);font-weight:600;font-size:1.3rem;font-variant-numeric:tabular-nums}
.qcells .plus{color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin:0 0 1.1rem}
.actions .btn{min-height:3.6rem}
.actions .btn.dark{flex-direction:column;gap:0}

    ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.left = '0'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    try { ta.select(); ta.setSelectionRange(0, text.length); ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    cb(ok);
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { cb(true); }, fallback);
      return;
    }
  } catch (e) {}
  fallback();
}
function flash(btn, msg) {
  if (!btn.hasAttribute('data-label')) btn.setAttribute('data-label', btn.textContent);
  btn.textContent = msg;
  live.textContent = msg;
  clearTimeout(btn._t);
  btn._t = setTimeout(function () { btn.textContent = btn.getAttribute('data-label'); }, 2000);
}

/* ── 詢價條與覆蓋層 ── */
var qbar = document.getElementById('qbar'), qbarN = document.getElementById('qbarN');
var sheet = document.getElementById('qsheet'), sheetN = document.getElementById('qsheetN'), sheetList = document.getElementById('qsheetList');
var qcopy = document.getElementById('qcopy'), qmsg = document.getElementById('qmsg'), qtext = document.getElementById('qtext'), qline = document.getElementById('qline');
var qlineNote = document.getElementById('qlineNote'), qtel = document.getElementById('qtel'), qwa = document.getElementById('qwa');
var qmailRow = document.getElementById('qmailRow'), qmail = document.getElementById('qmail'), qmailCopy = document.getElementById('qmailCopy'), qadd = document.getElementById('qadd');
/* 詢價單按鈕順序：LINE 傳送 → 複製 → 打電話 → WhatsApp → 信箱 → 加 LINE 好友；設定沒填的不出現 */
function setupContacts() {
  qline.hidden = qlineNote.hidden = !LINE_ID;
  qtel.hidden = !TEL_HREF;
  if (TEL_HREF) { qtel.href = TEL_HREF; document.getElementById('qtelTxt').textContent = TEL_TXT; }
  qwa.hidden = !WA_BASE;
  qmailRow.hidden = !EMAIL;
  if (EMAIL) document.getElementById('qmailTxt').textContent = EMAIL;
  qadd.hidden = !LINE_ADD;
  if (LINE_ADD) { qadd.href = LINE_ADD; document.getElementById('qaddTxt').textContent = LINE_ID; }
}
function updateBar() {
  qbarN.textContent = INQ.length;
  qbar.classList.toggle('zero', INQ.length === 0);
  sheetN.textContent = INQ.length;
}
/* 商品頁的鈕：加入後變「看詢價單 ›」；移除只在詢價單做 */
function updateAddBtn() {
  var b = document.getElementById('addq');
  if (!b) return;
  var on = inInq(b.getAttribute('data-id'));
  b.classList.toggle('on', on);
  b.textContent = on ? ADDED_TXT : ADD_TXT;
}
/* 清單縮圖角落的小勾跟著詢價單更新 */
function refreshMarks() {
  view.querySelectorAll('.c-ph[data-pid]').forEach(function (el) { el.classList.toggle('inq', inInq(el.getAttribute('data-pid'))); });
}
function addInq(id) {
  if (!inInq(id)) INQ.push({ id: id, want: '' });
  saveInq(); updateBar(); updateAddBtn(); refreshMarks();
}
/* 傳送類連結帶上詢價內容；詢價單空的時候 LINE 傳送不能按，WhatsApp／信箱仍可當一般聯絡用 */
function setLinks() {
  var t = INQ.length ? inquiryText() : '';
  if (LINE_ID && t) { qline.href = LINE_MSG + encodeURIComponent(t); qline.removeAttribute('aria-disabled'); }
  else { qline.removeAttribute('href'); qline.setAttribute('aria-disabled', 'true'); }
  if (WA_BASE) qwa.href = WA_BASE + (t ? '?text=' + encodeURIComponent(t) : '');
  if (EMAIL) qmail.href = mailHref(t);
}
function drawSheet() {
  updateBar();
  qcopy.disabled = INQ.length === 0;
  setLinks();
  if (!INQ.length) { sheetList.innerHTML = '<p class="qempty">尚未加入商品</p>'; return; }
  var h = '<div class="qgrid" role="table"><div class="qrow qhead" role="row"><span role="columnheader">品名</span><span role="columnheader">車種</span><span role="columnheader">規格</span><span class="c-qty" role="columnheader">現有</span></div>';
  INQ.forEach(function (e) {
    var x = byId.get(e.id), fid = 'want-' + esc(x.id);
    h += '<div class="qrow" role="row">' +
      '<span class="c-name" role="cell">' + val(x.name) + '</span>' +
      '<span class="c-car" role="cell">' + val(x.car_code) + '</span>' +
      '<span class="c-spec" role="cell">' + val(x.spec) + '</span>' +
      '<span class="c-qty" role="cell">' + qtyList(x) + '</span>' +
      '<div class="qwant"><span class="qcode">' + val(x.code) + '</span><label for="' + fid + '">想要</label><input id="' + fid + '" data-want="' + esc(x.id) + '" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" value="' + esc(e.want || '') + '"><span class="u">' + (has(x.unit_a) ? esc(x.unit_a) : '') + '</span></div>' +
      '<button type="button" class="btn small line rm" data-rm="' + esc(x.id) + '">移除</button></div>';
  });
  sheetList.innerHTML = h + '</div>';
}
/* 例：1. H0007｜活塞｜K4E｜正廠｜想要 2 只（空欄位整段省略，不印 —） */
function inquiryText() {
  var lines = INQ.map(function (e, i) {
    var x = byId.get(e.id);
    var parts = [x.code, x.name, x.car_code, x.spec, x.brand].filter(has).map(String);
    if (has(e.want)) parts.push('想要 ' + e.want + (has(x.unit_a) ? ' ' + x.unit_a : ''));
    return (i + 1) + '. ' + parts.join('｜');
  });
  return '禾賀清倉詢價\n' + lines.join('\n') + '\n—— 請回覆報價，謝謝';
}
function openSheet() {
  if (!sheet.hidden) return;
  qmsg.textContent = ''; qtext.hidden = true;
  drawSheet();
  sheet.hidden = false;
  document.documentElement.classList.add('lock');
  sheet.scrollTop = 0;
  try { sheet.focus({ preventScroll: true }); } catch (e) {}
}
function closeSheet() {
  if (sheet.hidden) return;
  sheet.hidden = true;
  if (lb.hidden) document.documentElement.classList.remove('lock');
  updateAddBtn(); refreshMarks();
}
document.getElementById('qbarBtn').addEventListener('click', function () { go('q'); });
document.getElementById('qsheetClose').addEventListener('click', goBack);
sheetList.addEventListener('input', function (e) {
  var t = e.target, id = t && t.getAttribute('data-want');
  if (!id) return;
  var v = t.value.normalize('NFKC').replace(/\D/g, '').slice(0, 6);
  if (t.value !== v) t.value = v;
  INQ.forEach(function (q) { if (q.id === id) q.want = v; });
  saveInq();
  setLinks();
  if (!qtext.hidden) qtext.value = inquiryText();
});
sheetList.addEventListener('click', function (e) {
  var b = e.target.closest('[data-rm]');
  if (!b) return;
  INQ = INQ.filter(function (q) { return q.id !== b.getAttribute('data-rm'); });
  saveInq(); drawSheet(); updateAddBtn(); refreshMarks();
  qmsg.textContent = '';
  if (!qtext.hidden) { if (INQ.length) qtext.value = inquiryText(); else qtext.hidden = true; }
});
function selectAll(el) {
  try {
    if (el.tagName === 'TEXTAREA') { el.focus(); el.select(); el.setSelectionRange(0, el.value.length); return; }
    var r = document.createRange(); r.selectNodeContents(el);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  } catch (e) {}
}
function copyWith(text, el, okMsg, prep) {
  function fallback() {
    if (prep) prep();
    selectAll(el);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    qmsg.textContent = ok ? okMsg : '已選取，請長按「拷貝」';
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { qmsg.textContent = okMsg; }, fallback);
      return;
    }
  } catch (e) {}
  fallback();
}
qcopy.addEventListener('click', function () {
  if (!INQ.length) return;
  var t = inquiryText();
  copyWith(t, qtext, LINE_ID ? '已複製，貼到 LINE 給我們就好' : '已複製，貼到訊息裡傳給我們就好', function () { qtext.value = t; qtext.hidden = false; });
});
qmailCopy.addEventListener('click', function () {
  if (!EMAIL) return;
  copyText(EMAIL, function (ok) { qmsg.textContent = ok ? '已複製信箱 ' + EMAIL : '請長按信箱文字選取'; });
});

/* ── 照片放大 ── */
var lb = document.getElementById('lb'), lbStrip = document.getElementById('lbStrip'), lbN = document.getElementById('lbN');
function lbCount() {
  var n = lbStrip.children.length;
  if (n < 2) { lbN.textContent = ''; return; }
  lbN.textContent = (Math.min(n - 1, Math.round(lbStrip.scrollLeft / Math.max(1, lbStrip.clientWidth))) + 1) + ' / ' + n;
}
function openLB(i) {
  if (!curItem || !curItem.photos || !curItem.photos.length) return;
  var x = curItem;
  lbStrip.innerHTML = x.photos.map(function (p, k) { return '<div class="lb-slide"><img src="photos/' + esc(p) + '" alt="' + esc(txt(x.name)) + ' 照片 ' + (k + 1) + '"></div>'; }).join('');
  lb.hidden = false;
  document.documentElement.classList.add('lock');
  lbStrip.style.scrollBehavior = 'auto';
  lbStrip.scrollLeft = i * lbStrip.clientWidth;
  lbStrip.style.scrollBehavior = '';
  lbCount();
  try { document.getElementById('lbClose').focus({ preventScroll: true }); } catch (e) {}
}
function closeLB() {
  if (lb.hidden) return;
  lb.hidden = true; lbStrip.innerHTML = '';
  if (sheet.hidden) document.documentElement.classList.remove('lock');
}
lbStrip.addEventListener('scroll', lbCount, { passive: true });
lb.addEventListener('click', closeLB);
document.addEventListener('keydown', function (e) {
  if (!lb.hidden) {
    if (e.key === 'Escape') { e.preventDefault(); closeLB(); }
    else if (e.key === 'ArrowRight') lbStrip.scrollBy({ left: lbStrip.clientWidth });
    else if (e.key === 'ArrowLeft') lbStrip.scrollBy({ left: -lbStrip.clientWidth });
    return;
  }
  if (!sheet.hidden && e.key === 'Escape') { e.preventDefault(); goBack(); }
});

/* ── 頁面內點擊 ── */
view.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act],[data-lb],[data-copy],#addq');
  if (!t) return;
  if (t.id === 'addq') { var id = t.getAttribute('data-id'); if (inInq(id)) go('q'); else addInq(id); return; }
  if (t.hasAttribute('data-lb')) { openLB(+t.getAttribute('data-lb')); return; }
  if (t.hasAttribute('data-copy')) { copyText(t.getAttribute('data-copy'), function (ok) { flash(t, ok ? '已複製' : '請長按選取'); }); return; }
  var act = t.getAttribute('data-act');
  if (act === 'back') goBack();
  else if (act === 'clearsearch') clearSearch();
});

/* ── 頁首下一行：更新日期（組站時填入；沒填到就整段不顯示）＋商品數 ── */
var genAt = document.getElementById('genAt'), genTxt = genAt ? genAt.textContent.trim() : '';
if (!genTxt || /^_{2}/.test(genTxt)) document.getElementById('genWrap').hidden = true;
document.getElementById('bannerN').textContent = DATA.length;

window.addEventListener('hashchange', onNav);
setupContacts();
updateBar();
onNav();
})();
</script>
</body>
</html>
